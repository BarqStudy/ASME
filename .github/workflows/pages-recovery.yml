name: Recover the blocked Pages publication
on:
  push:
    branches: [main]
    paths: [.github/workflows/pages-recovery.yml]
permissions:
  contents: read
  pages: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const blocked = '5f23eb26d05b90ffcf46e352cba1ad151a260628';
            const { data } = await github.rest.repos.compareCommits({ owner, repo, base: blocked, head: context.sha });
            if (data.status !== 'ahead') throw new Error('Only the superseded revision reported by Pages may be recovered.');
            await github.request('POST /repos/{owner}/{repo}/pages/deployments/{deploymentId}/cancel', { owner, repo, deploymentId: blocked });
            core.notice(`Cancellation accepted for stale Pages deployment ${blocked}`);
