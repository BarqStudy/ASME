name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  # Finish the current Pages deployment before starting another revision.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare a single Pages deployment path
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: branch } = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            if (branch.commit.sha !== context.sha) {
              throw new Error('A newer commit is available; do not deploy an older revision.');
            }
            const { data: pages } = await github.request('GET /repos/{owner}/{repo}/pages', { owner, repo });
            if (pages.build_type !== 'workflow') {
              await github.request('PUT /repos/{owner}/{repo}/pages', { owner, repo, build_type: 'workflow' });
              core.info('GitHub Pages now uses this workflow, avoiding duplicate branch deployments.');
            }
            const { data: commits } = await github.rest.repos.listCommits({ owner, repo, sha: context.sha, per_page: 10 });
            const active = new Set(['queued', 'pending', 'in_progress', 'building', 'deployment_pending', 'deployment_in_progress', 'syncing_files', 'updating_pages']);
            for (const commit of commits.slice(1)) {
              let deployment;
              try {
                ({ data: deployment } = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deploymentId}', { owner, repo, deploymentId: commit.sha }));
              } catch (error) {
                if (error.status === 404) continue;
                throw error;
              }
              if (!active.has(deployment.status)) continue;
              await github.request('POST /repos/{owner}/{repo}/pages/deployments/{deploymentId}/cancel', { owner, repo, deploymentId: commit.sha });
              core.info(`Cancelled superseded Pages deployment ${commit.sha}: ${deployment.status}`);
            }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            platform/package-lock.json
      - run: npm ci
      - run: npm ci --prefix platform
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
        working-directory: platform
      - run: npm --prefix platform run test:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
