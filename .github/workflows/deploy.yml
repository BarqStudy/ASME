name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stalled_deployment:
        description: 'Superseded Pages deployment ID explicitly reported as blocking publication'
        type: string
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  # Finish the current Pages deployment before starting another revision.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Respect the configured Pages deployment path
        id: pages
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: branch } = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            if (branch.commit.sha !== context.sha) {
              throw new Error('A newer commit is available; do not deploy an older revision.');
            }
            const { data: pages } = await github.request('GET /repos/{owner}/{repo}/pages', { owner, repo });
            core.setOutput('use_workflow', pages.build_type === 'workflow');
            core.setOutput('page_url', pages.html_url);
            core.info(`Using the existing Pages build type: ${pages.build_type}`);
            const recovery = context.payload.inputs?.stalled_deployment;
            if (recovery) {
              if (!/^[a-f0-9]{40}$/.test(recovery) || recovery === context.sha) {
                throw new Error('Recovery must name a superseded Pages revision.');
              }
              const { data: comparison } = await github.rest.repos.compareCommits({ owner, repo, base: recovery, head: context.sha });
              if (comparison.status !== 'ahead') throw new Error('Recovery revision must be an ancestor of this deployment.');
              await github.request('POST /repos/{owner}/{repo}/pages/deployments/{deploymentId}/cancel', { owner, repo, deploymentId: recovery });
              core.notice(`Cancelled the explicitly reported stale Pages lock: ${recovery}`);
            }
            const { data: commits } = await github.rest.repos.listCommits({ owner, repo, sha: context.sha, per_page: 10 });
            const active = new Set(['queued', 'pending', 'in_progress', 'building', 'deployment_pending', 'deployment_in_progress', 'syncing_files', 'updating_pages']);
            for (const commit of commits.slice(1)) {
              let deployment;
              try {
                ({ data: deployment } = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deploymentId}', { owner, repo, deploymentId: commit.sha }));
              } catch (error) {
                if (error.status === 404) continue;
                throw error;
              }
              if (!active.has(deployment.status)) continue;
              await github.request('POST /repos/{owner}/{repo}/pages/deployments/{deploymentId}/cancel', { owner, repo, deploymentId: commit.sha });
              core.info(`Cancelled superseded Pages deployment ${commit.sha}: ${deployment.status}`);
            }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            platform/package-lock.json
      - run: npm ci
      - run: npm ci --prefix platform
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
        working-directory: platform
      - run: npm --prefix platform run test:pages
      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.use_workflow == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.use_workflow == 'true'
        with:
          path: dist
      - name: Deploy
        if: steps.pages.outputs.use_workflow == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
