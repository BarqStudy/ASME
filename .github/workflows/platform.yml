name: Engineering Hub checks
on:
  push:
    paths: ['platform/**', '.github/workflows/platform.yml']
  pull_request:
    paths: ['platform/**', '.github/workflows/platform.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: asme
          POSTGRES_DB: asme_ci
          POSTGRES_PASSWORD: ephemeral_ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U asme -d asme_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: platform
    env:
      DATABASE_URL: postgresql://asme:ephemeral_ci_only@localhost:5432/asme_ci
      APP_URL: http://localhost:3000
      MAIL_MODE: file
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run build
